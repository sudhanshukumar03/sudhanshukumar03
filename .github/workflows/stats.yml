name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:     # Allow manual triggering
  push:
    branches:
      - main

# Prevent multiple workflows from running simultaneously
concurrency:
  group: 3d-contribution-calendar
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  generate-3d-contrib:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git configuration
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Stage and commit changes
        id: commit_changes
        run: |
          # Stage all changes
          git add -A
          
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✓ No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected:"
            git diff --cached --stat
            
            # Commit the changes
            git commit -m "chore: update 3D contribution calendar [skip ci]" \
              -m "Generated at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "✅ Changes committed locally"
          fi

      - name: Pull latest and merge
        if: steps.commit_changes.outputs.has_changes == 'true'
        run: |
          echo "🔄 Pulling latest changes from remote..."
          
          # Try rebase first (cleaner history)
          if git pull --rebase origin main; then
            echo "✅ Rebased successfully on latest main"
          else
            echo "⚠ Rebase failed, attempting merge instead..."
            git rebase --abort 2>/dev/null || true
            
            # Use merge as fallback
            git pull origin main --no-rebase -m "Merge with remote changes [skip ci]" || {
              echo "❌ Merge failed"
              exit 1
            }
            echo "✅ Merged successfully"
          fi

      - name: Push with retry logic
        if: steps.commit_changes.outputs.has_changes == 'true'
        run: |
          for i in {1..5}; do
            echo "📤 Push attempt $i/5..."
            
            if git push origin main; then
              echo "✅ Successfully pushed changes"
              exit 0
            else
              if [ $i -lt 5 ]; then
                echo "⚠ Push failed, pulling and retrying in $((i * 3)) seconds..."
                sleep $((i * 3))
                
                # Try to resolve conflicts with pull
                git pull origin main --no-rebase || {
                  echo "❌ Failed to pull, trying reset..."
                  git reset --hard origin/main
                  exit 1
                }
              fi
            fi
          done
          
          echo "❌ Failed to push after 5 attempts"
          exit 1

      - name: Workflow summary
        if: always()
        run: |
          echo "## 3D Contribution Calendar Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.commit_changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ **Calendar updated and pushed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **No changes needed**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Username**: ${{ github.repository_owner }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: main" >> $GITHUB_STEP_SUMMARY
          echo "- **Runtime**: Node.js 24 (GitHub Actions default)" >> $GITHUB_STEP_SUMMARY

      - name: Failure diagnostics
        if: failure()
        run: |
          echo "## ⚠️ Workflow Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: Git operations failed" >> $GITHUB_STEP_SUMMARY
          echo "**Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Debug Info**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git status >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
