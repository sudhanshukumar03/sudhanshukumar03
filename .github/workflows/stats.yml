name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:     # Allow manual triggering
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  generate-3d-contrib:
    runs-on: ubuntu-latest
    name: Generate 3D Contribution Graph
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git configuration
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Check if changes exist
        id: verify_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✓ No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: Commit and push changes
        if: steps.verify_changes.outputs.has_changes == 'true'
        run: |
          git add -A
          git commit -m "chore: update 3D contribution calendar [skip ci]" \
            -m "Generated at $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
            --allow-empty
          
          # Retry logic for push
          for i in {1..3}; do
            if git push; then
              echo "✓ Successfully pushed changes"
              exit 0
            else
              echo "⚠ Push attempt $i failed, retrying..."
              sleep $((i * 5))
            fi
          done
          echo "✗ Failed to push after 3 attempts"
          exit 1

      - name: Workflow summary
        if: always()
        run: |
          echo "## 3D Contribution Calendar Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Workflow completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "📅 Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "👤 Username: ${{ github.repository_owner }}" >> $GITHUB_STEP_SUMMARY

      - name: Handle failure
        if: failure()
        run: |
          echo "## ⚠️ 3D Contribution Calendar Update Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Issue**: The workflow encountered an error while generating or pushing the 3D contribution calendar." >> $GITHUB_STEP_SUMMARY
          echo "**Time**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View logs for more details." >> $GITHUB_STEP_SUMMARY
